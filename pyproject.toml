[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-counter"
version = "0.1.0"
description = "A CLI tool for counting tokens for various LLM providers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "tiktoken>=0.5.0",
    "anthropic>=0.7.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
token-counter = "token_counter.cli:main"
count-tokens-for-file = "count_tokens_for_file:main"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=token_counter --cov-report=term-missing"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, E266, W503"
exclude = ".git,__pycache__,build,dist"